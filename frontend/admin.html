<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRIBE Admin</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0b12; color: #f2f0f7; max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin-top: 32px; color: #a29fb5; text-transform: uppercase; letter-spacing: 1px; }
  input, textarea { width: 100%; background: #14141f; border: 1px solid #2b2b3d; color: #f2f0f7; border-radius: 8px; padding: 10px; font-size: 14px; box-sizing: border-box; }
  button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 600; background: #ff3fa4; color: white; margin-top: 6px; }
  button.secondary { background: #2b2b3d; color: #f2f0f7; }
  .card { background: #191926; border: 1px solid #2b2b3d; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .muted { color: #a29fb5; font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-left: 8px; }
  .badge.open { background: rgba(255,63,164,0.15); color: #ff3fa4; }
  .badge.closed { background: rgba(41,224,201,0.15); color: #29e0c9; }
  .badge.pending { background: rgba(250, 199, 117, 0.15); color: #fac775; }
  .badge.active { background: rgba(41,224,201,0.15); color: #29e0c9; }
  .badge.rejected { background: rgba(226, 75, 74, 0.15); color: #e24b4a; }
  .badge.banned { background: rgba(226, 75, 74, 0.15); color: #e24b4a; }
  .badge.premium { background: rgba(124, 92, 255, 0.15); color: #7c5cff; }
  #key-gate { max-width: 400px; margin: 80px auto; text-align: center; }
  #user-search { margin-bottom: 12px; }
  .btn-danger { background: #e24b4a; }
</style>
</head>
<body>

<div id="key-gate">
  <h1>TRIBE Admin</h1>
  <p class="muted">Admin-Schlüssel eingeben (steht im Terminal, wenn der Server startet, falls keine ADMIN_KEY-Umgebungsvariable gesetzt ist).</p>
  <input type="password" id="admin-key-input" placeholder="Admin-Schlüssel" />
  <button id="unlock-btn" style="width:100%; margin-top:10px;">Anmelden</button>
  <p id="key-error" class="muted"></p>
</div>

<div id="admin-app" style="display:none;">
  <h1>TRIBE Admin</h1>
  <h2>Nutzer (sperren / Premium schenken)</h2>
  <input type="text" id="user-search" placeholder="Suche nach Name, E-Mail oder ID …" />
  <div id="users"></div>
  <h2>Meldungen</h2>
  <div id="reports"></div>
  <h2>Werbeanzeigen</h2>
  <div id="ads"></div>
  <h2>Support-Tickets</h2>
  <div id="tickets"></div>
</div>

<script>
let ADMIN_KEY = localStorage.getItem("tribe_admin_key") || "";

async function adminFetch(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Admin-Key": ADMIN_KEY, ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Fehler");
  return data;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

async function loadTickets() {
  const tickets = await adminFetch("/api/admin/support");
  const el = document.getElementById("tickets");
  if (tickets.length === 0) {
    el.innerHTML = `<p class="muted">Keine Tickets bisher.</p>`;
    return;
  }
  el.innerHTML = tickets
    .map(
      (t) => `
    <div class="card" data-id="${t.id}">
      <div class="row">
        <div>
          <strong>${escapeHtml(t.subject)}</strong>
          <span class="badge ${t.status}">${t.status === "open" ? "offen" : "geschlossen"}</span>
          <div class="muted">${escapeHtml(t.email)} · ${new Date(t.created_at).toLocaleString("de-DE")}</div>
        </div>
      </div>
      <p>${escapeHtml(t.message)}</p>
      <textarea class="reply-input" rows="2" placeholder="Antwort (optional, an Nutzer:in sichtbar)">${escapeHtml(t.reply || "")}</textarea>
      <div class="row" style="margin-top:8px;">
        <button class="save-reply-btn">Antwort speichern</button>
        <button class="secondary toggle-status-btn">${t.status === "open" ? "Als erledigt markieren" : "Wieder öffnen"}</button>
      </div>
    </div>
  `
    )
    .join("");

  el.querySelectorAll(".save-reply-btn").forEach((btn) => {
    btn.onclick = async () => {
      const card = btn.closest(".card");
      const id = card.dataset.id;
      const reply = card.querySelector(".reply-input").value;
      await adminFetch(`/api/admin/support/${id}`, { method: "PATCH", body: JSON.stringify({ reply }) });
      loadTickets();
    };
  });
  el.querySelectorAll(".toggle-status-btn").forEach((btn) => {
    btn.onclick = async () => {
      const card = btn.closest(".card");
      const id = card.dataset.id;
      const current = card.querySelector(".badge").textContent.trim();
      const newStatus = current === "offen" ? "closed" : "open";
      await adminFetch(`/api/admin/support/${id}`, { method: "PATCH", body: JSON.stringify({ status: newStatus }) });
      loadTickets();
    };
  });
}

function fmtDate(iso) {
  return iso ? new Date(iso).toLocaleDateString("de-DE") : "";
}

async function banUser(id) {
  const reason = prompt("Grund für die Sperrung (wird nur intern gespeichert):", "") || "";
  if (!confirm("Diesen Account wirklich sperren? Ein aktives oder geschenktes Premium/Abo wird dabei sofort und ohne Erstattung beendet.")) return;
  await adminFetch(`/api/admin/users/${id}/ban`, { method: "POST", body: JSON.stringify({ reason }) });
  loadUsers();
  loadReports();
}

async function unbanUser(id) {
  await adminFetch(`/api/admin/users/${id}/unban`, { method: "POST" });
  loadUsers();
}

async function grantPremium(id) {
  const days = Number(prompt("Premium schenken — für wie viele Tage?", "30"));
  if (!days || days <= 0) return;
  await adminFetch(`/api/admin/users/${id}/grant-premium`, { method: "POST", body: JSON.stringify({ days }) });
  loadUsers();
}

async function revokePremium(id) {
  if (!confirm("Premium diesem Nutzer entziehen?")) return;
  await adminFetch(`/api/admin/users/${id}/revoke-premium`, { method: "POST" });
  loadUsers();
}

let allUsers = [];

async function loadUsers() {
  allUsers = await adminFetch("/api/admin/users");
  renderUsers();
}

function renderUsers() {
  const q = document.getElementById("user-search").value.trim().toLowerCase();
  const el = document.getElementById("users");
  const filtered = q
    ? allUsers.filter(
        (u) =>
          u.email.toLowerCase().includes(q) ||
          u.name.toLowerCase().includes(q) ||
          String(u.id) === q
      )
    : allUsers;
  if (filtered.length === 0) {
    el.innerHTML = `<p class="muted">Keine Nutzer gefunden.</p>`;
    return;
  }
  el.innerHTML = filtered
    .map(
      (u) => `
    <div class="card" data-id="${u.id}">
      <div class="row">
        <div>
          <strong>${escapeHtml(u.name)}</strong> (#${u.id})
          ${u.banned ? '<span class="badge banned">gesperrt</span>' : ""}
          ${u.premium ? '<span class="badge premium">Premium</span>' : ""}
          <div class="muted">${escapeHtml(u.email)} · registriert ${fmtDate(u.created_at)}</div>
          ${u.premium ? `<div class="muted">Premium bis ${fmtDate(u.premium_until)}</div>` : ""}
          ${u.banned ? `<div class="muted">Gesperrt am ${fmtDate(u.banned_at)}${u.ban_reason ? " · Grund: " + escapeHtml(u.ban_reason) : ""}</div>` : ""}
        </div>
      </div>
      <div class="row" style="margin-top:8px; flex-wrap: wrap;">
        ${
          u.banned
            ? '<button class="secondary unban-btn">Entsperren</button>'
            : '<button class="btn-danger ban-btn">Sperren</button>'
        }
        <button class="secondary grant-premium-btn">Premium schenken</button>
        ${u.premium ? '<button class="secondary revoke-premium-btn">Premium entziehen</button>' : ""}
      </div>
    </div>
  `
    )
    .join("");

  el.querySelectorAll(".ban-btn").forEach((btn) => {
    btn.onclick = () => banUser(btn.closest(".card").dataset.id);
  });
  el.querySelectorAll(".unban-btn").forEach((btn) => {
    btn.onclick = () => unbanUser(btn.closest(".card").dataset.id);
  });
  el.querySelectorAll(".grant-premium-btn").forEach((btn) => {
    btn.onclick = () => grantPremium(btn.closest(".card").dataset.id);
  });
  el.querySelectorAll(".revoke-premium-btn").forEach((btn) => {
    btn.onclick = () => revokePremium(btn.closest(".card").dataset.id);
  });
}

document.getElementById("user-search").addEventListener("input", renderUsers);

async function loadReports() {
  const reports = await adminFetch("/api/admin/reports");
  const el = document.getElementById("reports");
  if (reports.length === 0) {
    el.innerHTML = `<p class="muted">Keine Meldungen bisher.</p>`;
    return;
  }
  el.innerHTML = reports
    .map(
      (r) => `
    <div class="card" data-id="${r.id}">
      <div class="row">
        <div>
          <strong>${escapeHtml(r.reported_name)}</strong> gemeldet von ${escapeHtml(r.reporter_name)}
          <span class="badge ${r.status}">${r.status === "open" ? "offen" : "geschlossen"}</span>
          <div class="muted">${escapeHtml(r.reason)} · ${new Date(r.created_at).toLocaleString("de-DE")}</div>
          <div class="muted">Gemeldet: ${escapeHtml(r.reported_email)} · Meldende:r: ${escapeHtml(r.reporter_email)}</div>
        </div>
      </div>
      ${r.message ? `<p>${escapeHtml(r.message)}</p>` : ""}
      <div class="row" style="margin-top:8px;">
        <button class="secondary toggle-report-btn">${r.status === "open" ? "Als erledigt markieren" : "Wieder öffnen"}</button>
        <button class="btn-danger ban-from-report-btn" data-reported-id="${r.reported_id}">Gemeldete:n Nutzer:in sperren</button>
      </div>
    </div>
  `
    )
    .join("");

  el.querySelectorAll(".toggle-report-btn").forEach((btn) => {
    btn.onclick = async () => {
      const card = btn.closest(".card");
      const id = card.dataset.id;
      const current = card.querySelector(".badge").textContent.trim();
      const newStatus = current === "offen" ? "closed" : "open";
      await adminFetch(`/api/admin/reports/${id}`, { method: "PATCH", body: JSON.stringify({ status: newStatus }) });
      loadReports();
    };
  });
  el.querySelectorAll(".ban-from-report-btn").forEach((btn) => {
    btn.onclick = () => banUser(btn.dataset.reportedId);
  });
}

async function loadAds() {
  const ads = await adminFetch("/api/admin/ads");
  const el = document.getElementById("ads");
  if (ads.length === 0) {
    el.innerHTML = `<p class="muted">Keine Anzeigen bisher.</p>`;
    return;
  }
  el.innerHTML = ads
    .map(
      (a) => `
    <div class="card" data-id="${a.id}">
      <div class="row">
        <div>
          <strong>${escapeHtml(a.emoji || "")} ${escapeHtml(a.title)}</strong>
          <span class="badge ${a.status}">${a.status}</span>
          <div class="muted">${escapeHtml(a.advertiser_email || "Beispiel-Anzeige")} ${a.expires_at ? "· läuft ab " + new Date(a.expires_at).toLocaleDateString("de-DE") : ""}</div>
        </div>
      </div>
      <p>${escapeHtml(a.body)} — Button: "${escapeHtml(a.cta_label)}"</p>
      <div class="row">
        ${a.status !== "active" ? '<button class="approve-btn">Freigeben</button>' : ""}
        ${a.status !== "rejected" ? '<button class="secondary reject-btn">Ablehnen</button>' : ""}
      </div>
    </div>
  `
    )
    .join("");

  el.querySelectorAll(".approve-btn").forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest(".card").dataset.id;
      await adminFetch(`/api/admin/ads/${id}`, { method: "PATCH", body: JSON.stringify({ status: "active" }) });
      loadAds();
    };
  });
  el.querySelectorAll(".reject-btn").forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest(".card").dataset.id;
      await adminFetch(`/api/admin/ads/${id}`, { method: "PATCH", body: JSON.stringify({ status: "rejected" }) });
      loadAds();
    };
  });
}

async function tryUnlock() {
  try {
    await adminFetch("/api/admin/support");
    document.getElementById("key-gate").style.display = "none";
    document.getElementById("admin-app").style.display = "block";
    localStorage.setItem("tribe_admin_key", ADMIN_KEY);
    loadUsers();
    loadReports();
    loadTickets();
    loadAds();
  } catch (err) {
    document.getElementById("key-error").textContent = "Schlüssel falsch oder Server nicht erreichbar.";
  }
}

document.getElementById("unlock-btn").onclick = () => {
  ADMIN_KEY = document.getElementById("admin-key-input").value.trim();
  tryUnlock();
};

if (ADMIN_KEY) tryUnlock();
</script>
</body>
</html>
