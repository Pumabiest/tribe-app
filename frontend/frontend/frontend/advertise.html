<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Werbung auf TRIBE schalten</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  #ad-app { max-width: 480px; margin: 0 auto; padding: 32px 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>
<div id="ad-app">
  <h1 class="brand" style="font-size: 30px;">TRIBE</h1>
  <p class="tagline" style="margin-top:-8px;">Werbung für deine Marke, direkt in der App.</p>

  <div id="price-info" class="info-msg" style="margin: 16px 0;">Lädt…</div>

  <form id="ad-form">
    <div class="field"><label>Firmenname / Anzeigentitel</label><input type="text" name="title" maxlength="60" required /></div>
    <div class="field"><label>Anzeigentext</label><textarea name="adBody" rows="3" maxlength="160" required></textarea></div>
    <div class="field"><label>Emoji (optional, z.B. 🛍️)</label><input type="text" name="emoji" maxlength="4" placeholder="📢" /></div>
    <div class="field"><label>Button-Text</label><input type="text" name="ctaLabel" maxlength="30" placeholder="z.B. Shop ansehen" required /></div>
    <div class="field"><label>Deine E-Mail (für Rechnung & Rückfragen)</label><input type="email" name="advertiserEmail" required /></div>
    <button class="btn-primary" type="submit" style="width:100%;">Jetzt bezahlen & buchen</button>
  </form>
  <p id="ad-msg" style="margin-top: 14px;"></p>
  <p style="color: var(--text-dim); font-size: 13px; margin-top: 24px;">
    Nach der Zahlung wird deine Anzeige von uns geprüft und innerhalb von 24–48h freigeschaltet.
  </p>
</div>

<script>
async function loadPrice() {
  const el = document.getElementById("price-info");
  try {
    const res = await fetch("/api/ads/price");
    const data = await res.json();
    if (!data.live) {
      el.className = "error-msg";
      el.textContent = "Zahlungen sind noch nicht aktiv. Bitte später erneut versuchen oder direkt Kontakt aufnehmen.";
      document.getElementById("ad-form").querySelector("button").disabled = true;
      return;
    }
    el.textContent = `${data.priceEur.toFixed(2)} € für ${data.days} Tage Laufzeit im Swipe-Deck.`;
  } catch {
    el.className = "error-msg";
    el.textContent = "Server nicht erreichbar.";
  }
}

document.getElementById("ad-form").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const msg = document.getElementById("ad-msg");
  msg.innerHTML = "";
  try {
    const res = await fetch("/api/ads/purchase", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(fd)),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Fehler");
    window.location.href = data.url;
  } catch (err) {
    msg.innerHTML = `<span style="color: var(--danger);">${err.message}</span>`;
  }
};

const params = new URLSearchParams(location.search);
if (params.get("purchase") === "success") {
  document.getElementById("ad-msg").innerHTML = `<span style="color: var(--accent3);">Zahlung erfolgreich! Deine Anzeige wird jetzt geprüft.</span>`;
}

loadPrice();
</script>
</body>
</html>
